<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elan — Styles</title>

    <link rel="stylesheet" href="/frontend/css/variables.css" />
    <link rel="stylesheet" href="/frontend/css/sidebar.css" />
    <link rel="stylesheet" href="/frontend/css/components.css" />
    <link rel="stylesheet" href="/frontend/css/forms.css" />
  </head>

  <body>
    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>

    <!-- MAIN -->
    <main class="content">
      <!-- HEADER -->
      <div class="page-header">
        <h1>Стилі</h1>
        <button id="add-style-btn" class="btn btn-primary">
          + Додати стиль
        </button>
      </div>

      <!-- CARD -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">Список стилів</div>

          <div class="search-bar">
            <input
              type="text"
              placeholder="Пошук стилю..."
            />
          </div>
        </div>

        <!-- TABLE -->
        <div class="table-wrapper">
          <table id="styles-table">
            <thead>
              <tr>
                <th>№</th>
                <th>Назва</th>
                <th>Опис</th>
                <th>Дії</th>
              </tr>
            </thead>
            <tbody>
              <!-- JS inject -->
            </tbody>
          </table>
        </div>

        <!-- INFO -->
        <div class="pagination">
          <div id="styles-info">Немає даних</div>
        </div>
      </div>
    </main>

    <!-- SCRIPTS -->
    <script type="module" src="/frontend/layouts/sidebar.js"></script>
    <script type="module" src="/frontend/styles/styles.js"></script>
  </body>
</html>
