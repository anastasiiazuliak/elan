<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elan - Вхід</title>
    <link rel="stylesheet" href="/frontend/css/variables.css" />
    <link rel="stylesheet" href="/frontend/css/dark-theme.css" />
    <link rel="stylesheet" href="/frontend/css/components.css" />
    <link rel="stylesheet" href="/frontend/css/forms.css" />
    <link rel="stylesheet" href="/frontend/css/auth.css" />
  </head>
  <body class="auth-page">
    <section class="auth-hero" aria-hidden="true">
      <div class="auth-hero__motifs">
        <!-- Pointe shoe -->
        <svg class="motif-pointe" viewBox="0 0 240 320">
          <path
            d="M95 10
           C90 70 85 140 88 210
           C90 255 100 290 110 305
           L130 305
           C140 285 142 240 140 180
           C138 120 130 55 120 10"
          />

          <path
            d="M150 10
           C145 80 150 150 160 215
           C168 260 180 290 195 305
           L215 305
           C210 285 205 250 205 210
           C205 150 190 80 175 10"
          />

          <path d="M88 210 C105 220 120 220 140 210" />
          <path d="M160 215 C175 225 190 225 205 210" />

          <path d="M90 90 L135 60" />
          <path d="M85 120 L140 85" />
          <path d="M150 95 L195 60" />
          <path d="M155 125 L200 90" />
        </svg>

        <!-- Gymnastic hoop -->
        <svg class="motif-hoop" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="80" />
          <circle cx="100" cy="100" r="70" />
        </svg>

        <!-- Dumbbell -->
        <svg class="motif-dumbbell" viewBox="0 0 140 60">
          <rect x="10" y="15" width="18" height="30" rx="4" />
          <rect x="112" y="15" width="18" height="30" rx="4" />
          <rect x="28" y="25" width="84" height="10" rx="3" />
        </svg>

        <!-- Jump rope -->
        <svg class="motif-jumprope" viewBox="0 0 400 220">
          <rect x="35" y="90" width="18" height="60" rx="8" />
          <rect x="347" y="90" width="18" height="60" rx="8" />

          <path
            d="
    M50 120
    C90 20,
      310 20,
      350 120
  "
          />

          <path
            d="
    M50 120
    C90 200,
      310 200,
      350 120
  "
            opacity="0.4"
          />
        </svg>

        <!-- Musical note -->
        <svg class="motif-note" viewBox="0 0 60 60">
          <circle cx="16" cy="46" r="9" />
          <path d="M25 46 V12 L48 6 V36" />
          <circle cx="39" cy="36" r="9" />
        </svg>
      </div>
      <div class="auth-hero__top">
        <span class="auth-hero__mark">E</span>
        Elan
      </div>
      <div class="auth-hero__body">
        <h2>Рух починається тут</h2>
        <p>
          Розклад занять, групи та клієнти студії — увійдіть, щоб продовжити
          роботу.
        </p>
      </div>
      <div class="auth-hero__foot">Студія танцю та фітнесу Elan</div>
    </section>

    <main class="auth-panel">
      <div class="auth-card">
        <p class="auth-card__eyebrow">Студія Elan</p>
        <h1>Вхід в акаунт</h1>
        <p class="auth-card__subtitle">
          Введіть логін і пароль, щоб продовжити
        </p>

        <div id="login-error" class="auth-error" role="alert">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="M12 8v4M12 16h.01"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span>Невірний логін або пароль</span>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="username">Логін</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group auth-field--password">
            <label for="password">Пароль</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn btn-primary auth-submit" type="submit">
            Увійти
          </button>
        </form>
      </div>
    </main>

    <script type="module" src="/frontend/auth/login.js"></script>
  </body>
</html>
