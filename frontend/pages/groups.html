<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elan — Групи</title>
    <link rel="stylesheet" href="/frontend/css/variables.css" />
    <link rel="stylesheet" href="/frontend/css/sidebar.css" />
    <link rel="stylesheet" href="/frontend/css/components.css" />
    <link rel="stylesheet" href="/frontend/css/forms.css" />
    <style>
      .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
      .tab-btn {
        padding: 8px 20px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all .15s;
      }
      .tab-btn.active {
        background: var(--pink-500);
        color: #fff;
        border-color: var(--pink-500);
      }
      .tab-panel { display: none; }
      .tab-panel.active { display: block; }

      /* SCHEDULE GRID */
      .schedule-grid {
        display: grid;
        grid-template-columns: 80px repeat(7, 1fr);
        gap: 2px;
        font-size: 12px;
      }
      .sg-head {
        background: var(--pink-50);
        padding: 8px 4px;
        text-align: center;
        font-weight: 700;
        font-size: 11px;
        color: var(--text-muted);
        border-radius: 6px;
      }
      .sg-time {
        background: var(--pink-50);
        padding: 8px 6px;
        font-weight: 600;
        color: var(--text-secondary);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
      }
      .sg-cell {
        min-height: 52px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px;
        position: relative;
      }
      .sg-cell:hover { background: var(--pink-50); }
      .sg-event {
        background: var(--pink-100);
        color: var(--pink-600);
        border-radius: 4px;
        padding: 3px 6px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.3;
        cursor: pointer;
      }
      .sg-event:hover { background: var(--pink-200); }
    </style>
  </head>
  <body>
    <div id="sidebar-container"></div>
    <main class="content">
      <div class="page-header">
        <h1>Групи</h1>
        <button id="add-group-btn" class="btn btn-primary">+ Додати групу</button>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="list">📋 Список груп</button>
        <button class="tab-btn" data-tab="schedule">📅 Розклад</button>
      </div>

      <!-- TAB: LIST -->
      <div id="tab-list" class="tab-panel active">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Список груп</div>
            <div class="search-bar">
              <input type="text" placeholder="Пошук групи..." oninput="filterTable(this, 'groups-table')" />
            </div>
          </div>
          <div class="table-wrapper">
            <table id="groups-table">
              <thead>
                <tr>
                  <th>№</th>
                  <th>Тренер</th>
                  <th>Стиль</th>
                  <th>Рівень</th>
                  <th>Учасників</th>
                  <th>Дії</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="pagination">
            <div id="groups-info">Завантаження...</div>
          </div>
        </div>
      </div>

      <!-- TAB: SCHEDULE -->
      <div id="tab-schedule" class="tab-panel">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Тижневий розклад усіх груп</div>
            <select id="schedule-group-filter" class="btn btn-ghost" style="padding:7px 12px;">
              <option value="">Усі групи</option>
            </select>
          </div>
          <div style="padding:16px; overflow-x:auto;">
            <div class="schedule-grid" id="schedule-grid"></div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/frontend/layouts/sidebar.js"></script>
    <script type="module" src="/frontend/groups/groups.js"></script>
  </body>
</html>
