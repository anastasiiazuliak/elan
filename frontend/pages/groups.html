<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elan - Групи</title>
    <link rel="stylesheet" href="/frontend/css/variables.css" />
    <link rel="stylesheet" href="/frontend/css/dark-theme.css" />
    <link rel="stylesheet" href="/frontend/css/sidebar.css" />
    <link rel="stylesheet" href="/frontend/css/components.css" />
    <link rel="stylesheet" href="/frontend/css/forms.css" />
    <link rel="stylesheet" href="/frontend/css/groups.css" />
  </head>
  <body>
    <div id="sidebar-container"></div>
    <main class="content">
      <div class="page-header">
        <h1>Групи</h1>
        <button id="add-group-btn" class="btn btn-primary">+ Додати групу</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="list">Список груп</button>
        <button class="tab-btn" data-tab="schedule">Розклад</button>
      </div>

      <div id="tab-list" class="tab-panel active">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Список груп</div>
            <div class="toolbar-filters">
              <input id="group-search" type="text" placeholder="Пошук групи..." />
              <select id="group-category-filter" aria-label="Фільтр за категорією">
                <option value="">Усі категорії</option>
              </select>
              <select id="group-level-filter" aria-label="Фільтр за рівнем">
                <option value="">Усі рівні</option>
              </select>
              <select id="group-style-filter" aria-label="Фільтр за стилем">
                <option value="">Усі стилі</option>
              </select>
            </div>
          </div>
          <div class="table-wrapper">
            <table id="groups-table">
              <thead>
                <tr>
                  <th>№</th>
                  <th>Назва</th>
                  <th>Тренер</th>
                  <th>Стиль</th>
                  <th>Рівень</th>
                  <th>Категорія</th>
                  <th>Абонементи</th>
                  <th>Дії</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="pagination">
            <div id="groups-info">Немає даних</div>
          </div>
        </div>
      </div>

      <div id="tab-schedule" class="tab-panel">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Тижневий розклад усіх груп</div>
            <select id="schedule-group-filter" class="btn btn-ghost">
              <option value="">Усі групи</option>
            </select>
          </div>
          <div style="padding:16px; overflow-x:auto;">
            <div class="schedule-grid" id="schedule-grid"></div>
          </div>
        </div>
      </div>

      <div id="group-clients-panel" class="card" style="display:none;">
        <div class="card-header">
          <div>
            <div class="card-title" id="group-clients-title">Клієнти групи</div>
            <div id="group-clients-subtitle" class="muted-line"></div>
          </div>
          <button id="back-to-groups-btn" class="btn btn-ghost">Назад до груп</button>
        </div>
        <div class="table-wrapper">
          <table id="group-clients-table">
            <thead>
              <tr>
                <th>№</th>
                <th>Клієнт</th>
                <th>Абонемент</th>
                <th>Початок</th>
                <th>Діє до</th>
                <th>Занять</th>
                <th>Дії</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="/frontend/layouts/sidebar.js"></script>
    <script type="module" src="/frontend/groups/groups.js"></script>
  </body>
</html>
