<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elan - Тренери</title>
    <link rel="stylesheet" href="/frontend/css/variables.css" />
    <link rel="stylesheet" href="/frontend/css/dark-theme.css" />
    <link rel="stylesheet" href="/frontend/css/sidebar.css" />
    <link rel="stylesheet" href="/frontend/css/components.css" />
    <link rel="stylesheet" href="/frontend/css/forms.css" />
  </head>
  <body>
    <div id="sidebar-container"></div>
    <main class="content">
      <div class="page-header">
        <h1>Тренери</h1>
        <button id="add-coach-btn" class="btn btn-primary">+ Додати тренера</button>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">Список тренерів</div>
          <div class="toolbar-filters">
            <input id="coach-search" type="text" placeholder="Пошук тренера..." />
            <select id="coach-style-filter" aria-label="Фільтр за стилем">
              <option value="">Усі стилі</option>
            </select>
          </div>
        </div>
        <div id="coaches-grid" class="coach-grid"></div>
        <div class="pagination">
          <div id="coaches-info">Немає даних</div>
        </div>
      </div>
    </main>
    <script type="module" src="/frontend/layouts/sidebar.js"></script>
    <script type="module" src="/frontend/coaches/coaches.js"></script>
  </body>
</html>
