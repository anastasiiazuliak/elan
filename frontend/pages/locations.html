<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elan — Локації</title>
    <link rel="stylesheet" href="/frontend/css/variables.css" />
    <link rel="stylesheet" href="/frontend/css/sidebar.css" />
    <link rel="stylesheet" href="/frontend/css/components.css" />
    <link rel="stylesheet" href="/frontend/css/forms.css" />
    <style>
      .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
      .tab-btn {
        padding: 8px 20px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all .15s;
      }
      .tab-btn.active { background: var(--pink-500); color: #fff; border-color: var(--pink-500); }
      .tab-panel { display: none; }
      .tab-panel.active { display: block; }

      /* location cards */
      .location-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
      .location-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        transition: all .2s;
      }
      .location-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
      .location-card-head {
        padding: 14px 16px;
        background: var(--pink-50);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .location-card-title { font-weight: 700; font-size: 14px; }
      .location-card-body { padding: 12px 16px; }
      .hall-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .hall-row:last-child { border-bottom: none; }
      .hall-actions { display: flex; gap: 4px; }

      /* schedule */
      .schedule-grid {
        display: grid;
        grid-template-columns: 80px repeat(6, 1fr);
        gap: 1px;
        min-width: 720px;
        background: var(--border);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      .sg-head {
        background: var(--pink-50);
        padding: 10px 6px;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-secondary);
      }
      .sg-time {
        background: var(--pink-50);
        padding: 10px 6px;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-secondary);
      }
      .sg-cell {
        min-height: 76px;
        background: var(--surface);
        padding: 4px;
      }
      .sg-event {
        background: var(--pink-100);
        color: var(--pink-600);
        border-radius: 6px;
        padding: 5px 7px;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;
      }
      .sg-event { position: relative; }
      .sg-delete {
        position: absolute;
        top: 4px; right: 4px;
        background: var(--surface);
        color: var(--pink-600);
        border: 1px solid var(--pink-200);
        display: none;
      }
      .sg-event:hover .sg-delete { display: block; }
    </style>
  </head>
  <body>
    <div id="sidebar-container"></div>
    <main class="content">
      <div class="page-header">
        <h1>Локації</h1>
        <button id="add-location-btn" class="btn btn-primary">+ Додати локацію</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="list"><span class="tab-icon" data-icon="location"></span> Локації та зали</button>
        <button class="tab-btn" data-tab="schedule"><span class="tab-icon" data-icon="calendar"></span> Розклад залів</button>
      </div>

      <!-- TAB: LIST -->
      <div id="tab-list" class="tab-panel active">
        <div id="location-cards" class="location-cards">
          <div style="color:var(--text-muted); padding:40px;">Немає даних</div>
        </div>
      </div>

      <!-- TAB: SCHEDULE -->
      <div id="tab-schedule" class="tab-panel">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Розклад за залом</div>
            <div style="display:flex;gap:8px;align-items:center;">
              <select id="schedule-location-sel" class="btn btn-ghost" style="padding:7px 12px;">
                <option value="">— Локація —</option>
              </select>
              <select id="schedule-hall-sel" class="btn btn-ghost" style="padding:7px 12px;">
                <option value="">— Зал —</option>
              </select>
            </div>
          </div>
          <div style="padding:16px; overflow-x:auto;">
            <div class="schedule-grid" id="schedule-grid"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- MODAL: SCHEDULE -->
    <div id="schedule-modal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Додати в розклад</div>
          <button class="close-btn" onclick="closeModal('schedule-modal')">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>День</label>
            <input id="schedule-day" type="text" readonly />
          </div>
          <div class="form-group">
            <label>Час</label>
            <input id="schedule-time" type="text" readonly />
          </div>
          <div class="form-group">
            <label>Група</label>
            <select id="schedule-group">
              <option value="">Немає даних</option>
            </select>
          </div>
        </div>
        <div class="form-footer">
          <button class="btn btn-ghost" onclick="closeModal('schedule-modal')">Скасувати</button>
          <button class="btn btn-primary" onclick="saveSchedule()">Зберегти</button>
        </div>
      </div>
    </div>

    <script type="module" src="/frontend/layouts/sidebar.js"></script>
    <script type="module" src="/frontend/locations/locations.js"></script>
  </body>
</html>
