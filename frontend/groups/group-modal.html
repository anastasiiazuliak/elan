<div id="group-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="group-modal-title">Додати групу</div>
      <button class="close-btn" id="group-close">x</button>
    </div>

    <div class="form-grid cols-2">
      <div class="form-group span2">
        <label for="group-name">Назва групи</label>
        <input id="group-name" type="text" placeholder="Junior Hip-Hop" />
      </div>
      <div class="form-group">
        <label for="group-coach">Тренер</label>
        <select id="group-coach"></select>
      </div>
      <div class="form-group">
        <label for="group-style">Стиль</label>
        <select id="group-style"></select>
      </div>
      <div class="form-group">
        <label for="group-level">Рівень підготовки</label>
        <select id="group-level">
          <option value="0">Початківець</option>
          <option value="1">Середній</option>
          <option value="2">Просунутий</option>
        </select>
      </div>
      <div class="form-group">
        <label for="group-category">Категорія</label>
        <select id="group-category"></select>
      </div>
      <div class="form-group span2">
        <label>Абонементи групи</label>
        <div id="group-subscriptions-checkboxes" class="checkbox-group"></div>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn btn-ghost" id="group-cancel">Скасувати</button>
      <button class="btn btn-primary" id="group-save">Зберегти</button>
    </div>
  </div>
</div>
