<div id="style-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="style-modal-title">Додати стиль</div>
      <button class="close-btn" id="style-close">✕</button>
    </div>

    <div class="form-grid cols-1">
      <div class="form-group">
        <label for="style-name">Назва стилю</label>
        <input
          id="style-name"
          type="text"
          placeholder="Наприклад: Hip-Hop"
        />
      </div>

      <div class="form-group">
        <label for="style-description">Опис</label>
        <textarea
          id="style-description"
          placeholder="Коротко опишіть стиль..."
        ></textarea>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn btn-ghost" id="style-cancel">Скасувати</button>
      <button class="btn btn-primary" id="style-save">Зберегти</button>
    </div>
  </div>
</div>
